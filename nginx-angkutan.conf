server {
    listen 80;
    listen [::]:80;
    server_name angkutan.kanjabung.com;

    root /var/www/angkutan;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
